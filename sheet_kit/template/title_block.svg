    <text id="text:revision" x="1868" y="1560" style="font-family:Helvetica;font-size:30px;fill:#111">Revision</text>
    <text id="text:sheet-number" x="1428" y="1655" style="font-family:Helvetica;font-weight:bold;font-size:60px;fill:#111">G001</text>
    <text id="text:sheet-title" x="1868" y="1624" style="font-family:Helvetica;font-size:30px;fill:#111">Title block and notes</text>
