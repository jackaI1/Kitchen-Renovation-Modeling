     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="24in" height="18in" viewBox="0 0 2400 1800" version="1.1"
     sodipodi:docname="title_block.svg">
  <g inkscape:groupmode="layer" inkscape:label="Sheet" id="layer-sheet">
    <rect id="frame" x="40" y="40" width="2320" height="1720" style="fill:none;stroke:#222;stroke-width:4"/>
