<?xml version="1.0" encoding="UTF-8"?>
<!-- Kitchen title block and notes sheet. Edit in Inkscape (Inkscape SVG).
     Sheet layer is exported. Guides layer holds the text boxes that the build checks
     and is removed from every export. Text ids must match a box id:
     text:<name> uses box:<name>; table cells use box:table:<name>:<column>. -->
