[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchen-renovation-study"
version = "0.1.0"
description = "Reproducible preliminary building-service and wall studies alongside a kitchen model"
requires-python = ">=3.11"
dependencies = ["ifcopenshell==0.9.0.post1", "ezdxf==1.4.5", "sympy==1.14.0", "pint==0.26.2"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0", "psutil==7.2.2"]

[tool.setuptools]
packages = ["renovation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
