name: vessel-3d-viewer / Viewer checks
on:
  push:
    branches:
    - main
    paths:
    - projects/vessel-3d-viewer/**
    - .github/workflows/vessel-3d-viewer-ci.yml
  pull_request:
    paths:
    - projects/vessel-3d-viewer/**
    - .github/workflows/vessel-3d-viewer-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: projects/vessel-3d-viewer/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: npm ci
    - run: npm run check
    - run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy
    - run: blender --background --factory-startup --python-exit-code 1 --python pipeline/export_vessel.py -- --output /tmp/vessel-rebuilt.glb
    - run: npx tsx pipeline/validate-glb.ts /tmp/vessel-rebuilt.glb
    - run: npx playwright install --with-deps chromium
    - run: npm run test:browser
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: browser-evidence
        path: projects/vessel-3d-viewer/test-results/
        retention-days: 7
defaults:
  run:
    working-directory: projects/vessel-3d-viewer
