name: cpm-schedule-xer / Tests
on:
  push:
    branches:
    - main
    paths:
    - projects/cpm-schedule-xer/**
    - .github/workflows/cpm-schedule-xer-ci.yml
  pull_request:
    paths:
    - projects/cpm-schedule-xer/**
    - .github/workflows/cpm-schedule-xer-ci.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python:
        - '3.9'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install pytest
    - run: python -m pytest -q
    - run: python cpm.py examples/building.xer --progress examples/progress.json --data-date '2026-01-07 08:00' --output /tmp/updated.xer
        --gantt /tmp/gantt.html
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/cpm-schedule-xer
