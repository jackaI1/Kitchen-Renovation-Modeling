name: project-schedule-cost-tracker / Tests
on:
  push:
    branches:
    - main
    paths:
    - projects/project-schedule-cost-tracker/**
    - .github/workflows/project-schedule-cost-tracker-tests.yml
  pull_request:
    paths:
    - projects/project-schedule-cost-tracker/**
    - .github/workflows/project-schedule-cost-tracker-tests.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.txt
    - run: python -m unittest discover -s tests -v
    - run: python -m tracker examples/capital_project.csv --start 2026-11-09 --output /tmp/project-reports
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/project-schedule-cost-tracker
